<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ConfHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
    <header id="site-header"></header>

    <main>
        <form class="panel" id="loginForm" novalidate>
            <h1>Welcome back</h1>
            <p class="form-message"></p>

            <label>Email
                <input type="email" name="email" autocomplete="email" placeholder="student@email.com">
            </label>
            <label>Password
                <input type="password" name="password" autocomplete="current-password">
            </label>

            <button class="btn full" type="submit">LOGIN</button>
            <p class="center"><a href="#" id="forgotLink">Forgot password?</a></p>
            <p class="center muted">Don't have an account? <a href="register.html">Register</a></p>
            <p class="center muted small-text">Demo admin: admin@confhub.com / admin123</p>
        </form>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
