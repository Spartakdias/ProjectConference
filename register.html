<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ConfHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
    <header id="site-header"></header>

    <main>
        <form class="panel" id="registerForm" novalidate>
            <h1>Create account</h1>
            <p class="form-message"></p>

            <label>First Name
                <input type="text" name="firstName" autocomplete="given-name">
            </label>
            <label>Last Name
                <input type="text" name="lastName" autocomplete="family-name">
            </label>
            <label>Email
                <input type="email" name="email" autocomplete="email" placeholder="student@email.com">
            </label>
            <label>Phone Number (optional)
                <input type="tel" name="phone" placeholder="+77001234567">
            </label>
            <label>Date of Birth (optional)
                <input type="date" name="dob">
            </label>
            <label>Password
                <input type="password" name="password" autocomplete="new-password">
            </label>
            <label>Confirm Password
                <input type="password" name="confirmPassword" autocomplete="new-password">
            </label>

            <button class="btn full" type="submit">REGISTER</button>
            <p class="center muted">Already have an account? <a href="login.html">Login</a></p>
        </form>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
