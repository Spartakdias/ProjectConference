<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferences | ConfHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="conferences">
    <header id="site-header"></header>

    <main>
        <h1>All conferences</h1>
        <p class="muted">Explore upcoming technology, business and science events.</p>

        <form class="filters" id="filters" role="search">
            <input type="search" id="search" placeholder="🔍 Search by title, speaker or city" aria-label="Search conferences">
            <select id="category" aria-label="Category"></select>
            <select id="city" aria-label="City"></select>
            <button class="btn" type="reset">Reset</button>
        </form>

        <p class="muted" id="resultCount"></p>
        <div class="cards" id="conferenceCards"></div>
        <p class="message" id="noResults" hidden>No conferences match your search. Try different filters.</p>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
