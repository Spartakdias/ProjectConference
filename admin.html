<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | ConfHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">
    <header id="site-header"></header>

    <main class="wide">
        <h1>Admin Panel</h1>
        <p class="success" id="adminMsg" role="status"></p>

        <div class="admin">
            <aside class="admin-menu" aria-label="Admin menu">
                <button type="button" data-tab="dashboard">📊 Dashboard</button>
                <button type="button" data-tab="users">👥 Users</button>
                <button type="button" data-tab="conferences">🎤 Conferences</button>
                <button type="button" data-tab="bookings">🎟️ Bookings</button>
            </aside>

            <div class="admin-content">
                <section data-panel="dashboard">
                    <h2>Dashboard</h2>
                    <div class="cards" id="stats"></div>
                </section>

                <section data-panel="users" hidden>
                    <h2>Users</h2>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Bookings</th></tr></thead>
                            <tbody id="userRows"></tbody>
                        </table>
                    </div>
                </section>

                <section data-panel="conferences" hidden>
                    <div class="toolbar">
                        <h2>Conferences</h2>
                        <button class="btn" type="button" id="addConfBtn">＋ Add conference</button>
                    </div>

                    <form class="card" id="confForm" hidden novalidate>
                        <h3 id="confFormTitle">Add conference</h3>
                        <p class="form-message"></p>
                        <input type="hidden" name="id">
                        <div class="form-grid">
                            <label>Title <input type="text" name="title"></label>
                            <label>Category <input type="text" name="category" list="categories"></label>
                            <label>City <input type="text" name="city"></label>
                            <label>Date <input type="date" name="date"></label>
                            <label>Speaker <input type="text" name="speaker"></label>
                            <label>Price ($) <input type="number" name="price" min="0"></label>
                            <label>Seats <input type="number" name="seats" min="1"></label>
                        </div>
                        <datalist id="categories">
                            <option value="Technology"><option value="Business"><option value="Science">
                        </datalist>
                        <label>Description <textarea name="description" rows="3"></textarea></label>
                        <label>Image path (optional, e.g. images/conf-9.jpg)
                            <input type="text" name="image" placeholder="images/my-photo.jpg">
                        </label>
                        <label>Program (one line per item, e.g. 09:00 - Welcome)
                            <textarea name="program" rows="4"></textarea>
                        </label>
                        <div class="button-row">
                            <button class="btn" type="submit">Save</button>
                            <button class="btn secondary" type="button" id="cancelConf">Cancel</button>
                        </div>
                    </form>

                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>ID</th><th>Title</th><th>Category</th><th>City</th><th>Date</th><th>Price</th><th>Seats left</th><th>Actions</th></tr></thead>
                            <tbody id="confRows"></tbody>
                        </table>
                    </div>
                </section>

                <section data-panel="bookings" hidden>
                    <h2>Bookings</h2>
                    <p class="muted" id="noAdminBookings" hidden>No bookings yet.</p>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>ID</th><th>User</th><th>Conference</th><th>Tickets</th><th>Total</th><th>Status</th></tr></thead>
                            <tbody id="adminBookingRows"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
