<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ConfHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile">
    <header id="site-header"></header>

    <main>
        <h1>My Profile</h1>
        <p class="success" id="profileMsg" role="status"></p>

        <section class="card profile-card">
            <div id="profileInfo"></div>
            <div class="button-row">
                <button class="btn" type="button" id="editBtn">Edit Profile</button>
                <button class="btn secondary" type="button" id="profileLogout">Logout</button>
            </div>

            <form id="editForm" class="edit-form" hidden novalidate>
                <h3>Edit profile</h3>
                <p class="form-message"></p>
                <label>First Name <input type="text" name="firstName"></label>
                <label>Last Name <input type="text" name="lastName"></label>
                <label>Phone Number <input type="tel" name="phone" placeholder="+77001234567"></label>
                <label>Date of Birth <input type="date" name="dob"></label>
                <div class="button-row">
                    <button class="btn" type="submit">Save</button>
                    <button class="btn secondary" type="button" id="cancelEdit">Cancel</button>
                </div>
            </form>
        </section>

        <h2 id="bookings">My bookings</h2>
        <p class="muted" id="noBookings" hidden>You have no bookings yet. <a href="conferences.html">Browse conferences</a></p>
        <div class="table-wrap" id="bookingTable">
            <table>
                <thead><tr><th>ID</th><th>Conference</th><th>Date</th><th>Tickets</th><th>Total</th><th>Status</th><th></th></tr></thead>
                <tbody id="bookingRows"></tbody>
            </table>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
